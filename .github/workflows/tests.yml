name: BuyWise Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          BUYWISE_DB_PATH: test_buywise_cache.db
          BUYWISE_CACHE_TTL_MINUTES: "30"
        run: pytest -q

      - name: Upload test database only if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buywise-test-artifacts
          path: test_buywise_cache.db
          if-no-files-found: ignore
